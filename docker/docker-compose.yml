services:
  aiclient-api:
    # Default deployment: build the image from this repository.
    # Usage from this directory: docker compose up -d --build
    # Usage from repository root: docker compose -f docker/docker-compose.yml up -d --build
    build:
      context: ..
      dockerfile: Dockerfile
    image: aiclient2api:local
    container_name: aiclient2api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8085-8087:8085-8087"
      - "1455:1455"
      - "19876-19880:19876-19880"
    volumes:
      - ../configs:/app/configs
    environment:
      - ARGS=
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
